<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly</title>
  <meta name="description" content="Oops! The page you are looking for does not exist on Stackly Farms. Return to our homepage to explore agricultural services.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header / Navigation -->
 
  <!-- Error Page Content -->
  <main class="error-page-container reveal">
    <div class="error-code">404</div>
    <h2 class="error-title">Page not found</h2>
    <p class="error-desc">Oops! The page you're looking for doesn't exist or has been removed.</p>
    
    <a href="index.html" class="btn-error-back">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Go to Home Page
    </a>

    <!-- Custom vector illustration of farmhouse and windmill with CSS-spinning blades -->
    <div class="error-illustration">
      <svg viewBox="0 0 600 250" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Hills -->
        <path d="M -50 250 Q 150 130 350 200 T 700 180 L 700 250 Z" fill="#e6efeb" />
        <path d="M 100 250 Q 300 150 500 220 T 750 200 L 750 250 Z" fill="#d2e5dd" />
        <path d="M -100 250 Q 100 200 300 235 T 700 210 L 700 250 Z" fill="#b9d6ca" />
        
        <!-- Flat ground field -->
        <rect x="0" y="220" width="600" height="30" fill="#a4cbba" />
        <path d="M 0 220 C 150 210, 450 210, 600 220 L 600 250 L 0 250 Z" fill="#90bfab" />

        <!-- Soft Clouds -->
        <path d="M 80 80 Q 95 65 110 80 Q 125 65 140 80 L 140 90 L 80 90 Z" fill="#f0f4f2" opacity="0.8"/>
        <path d="M 450 100 Q 465 85 480 100 Q 495 85 510 100 L 510 110 L 450 110 Z" fill="#f0f4f2" opacity="0.8"/>

        <!-- Wooden Fence -->
        <g stroke="#80623a" stroke-width="3" fill="none">
          <line x1="200" y1="210" x2="200" y2="235" />
          <line x1="225" y1="210" x2="225" y2="235" />
          <line x1="250" y1="210" x2="250" y2="235" />
          <line x1="275" y1="210" x2="275" y2="235" />
          <line x1="195" y1="215" x2="280" y2="215" />
          <line x1="195" y1="225" x2="280" y2="225" />
        </g>

        <!-- Farmhouse -->
        <g>
          <!-- Base Walls -->
          <rect x="290" y="170" width="105" height="55" fill="#fcfcfc" stroke="#60746b" stroke-width="2" />
          <!-- Roof -->
          <polygon points="282,170 342,125 402,170" fill="#0b6635" stroke="#064e28" stroke-width="2" />
          <!-- Door -->
          <rect x="330" y="190" width="25" height="35" fill="#064e28" />
          <!-- Windows -->
          <rect x="305" y="185" width="12" height="15" fill="#a4cbba" stroke="#60746b" stroke-width="1.5" />
          <line x1="311" y1="185" x2="311" y2="200" stroke="#60746b" />
          <line x1="305" y1="192" x2="317" y2="192" stroke="#60746b" />
          
          <rect x="368" y="185" width="12" height="15" fill="#a4cbba" stroke="#60746b" stroke-width="1.5" />
          <line x1="374" y1="185" x2="374" y2="200" stroke="#60746b" />
          <line x1="368" y1="192" x2="380" y2="192" stroke="#60746b" />
        </g>

        <!-- Windmill Tower -->
        <g stroke="#3a4b42" stroke-width="2">
          <!-- Legs -->
          <line x1="410" y1="225" x2="423" y2="120" />
          <line x1="436" y1="225" x2="423" y2="120" />
          <!-- Cross bars -->
          <line x1="414" y1="190" x2="432" y2="190" />
          <line x1="418" y1="155" x2="428" y2="155" />
          <!-- X braces -->
          <line x1="410" y1="225" x2="432" y2="190" />
          <line x1="436" y1="225" x2="414" y2="190" />
          <line x1="414" y1="190" x2="428" y2="155" />
          <line x1="432" y1="190" x2="418" y2="155" />
        </g>

        <!-- Windmill Rotor and Blades (hub at 423, 120) -->
        <g class="rotate-windmill-blades" style="transform-origin: 423px 120px;">
          <!-- Center hub -->
          <circle cx="423" cy="120" r="4" fill="#0b6635" />
          <!-- Outer circle wheel -->
          <circle cx="423" cy="120" r="30" fill="none" stroke="#0b6635" stroke-width="1.5" stroke-dasharray="2 3" />
          <!-- Blades (6 blades) -->
          <line x1="423" y1="120" x2="423" y2="80" stroke="#0b6635" stroke-width="2.5" />
          <polygon points="421,80 425,80 427,100 419,100" fill="#0b6635" />

          <line x1="423" y1="120" x2="423" y2="160" stroke="#0b6635" stroke-width="2.5" />
          <polygon points="421,160 425,160 427,140 419,140" fill="#0b6635" />

          <line x1="423" y1="120" x2="388" y2="100" stroke="#0b6635" stroke-width="2.5" />
          <polygon points="386,99 390,101 405,110 401,108" fill="#0b6635" />

          <line x1="423" y1="120" x2="458" y2="140" stroke="#0b6635" stroke-width="2.5" />
          <polygon points="456,139 460,141 445,130 441,128" fill="#0b6635" />

          <line x1="423" y1="120" x2="388" y2="140" stroke="#0b6635" stroke-width="2.5" />
          <polygon points="386,141 390,139 405,130 401,132" fill="#0b6635" />

          <line x1="423" y1="120" x2="458" y2="100" stroke="#0b6635" stroke-width="2.5" />
          <polygon points="456,101 460,99 445,110 441,108" fill="#0b6635" />
        </g>
        
        <!-- Fore-ground detail leaves -->
        <path d="M 30 220 Q 40 190 60 220 Z" fill="#064e28" opacity="0.8"/>
        <path d="M 50 220 Q 55 180 80 220 Z" fill="#0b6635" />
        <path d="M 530 220 Q 545 185 570 220 Z" fill="#0b6635" />
        <path d="M 550 220 Q 560 195 580 220 Z" fill="#064e28" opacity="0.8"/>
      </svg>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
