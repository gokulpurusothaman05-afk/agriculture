<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly</title>
  <meta name="description" content="Create a new Stackly Farms account to manage crops, connect with advisors, and buy seeds/tools.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <!-- Floating Back button -->
  <div style="position: absolute; top: 2rem; left: 2rem; z-index: 10;">
    <a href="index.html" class="auth-back-btn" style="color: var(--primary);">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Return Home
    </a>
  </div>

  <!-- Centered Floating Sign Up Card -->
  <div class="auth-card-floating reveal">
    <div class="auth-form-header">
      <h2>Sign Up</h2>
      <p style="color: var(--primary); font-weight: 500;">Create your account to get started</p>
    </div>

    <form class="auth-form" onsubmit="event.preventDefault(); alert('Signed Up successfully!'); window.location.href='login.html';">
      <!-- Full Name -->
      <div class="form-group">
        <label for="s-name" style="color: var(--primary);">Full Name</label>
        <div class="input-icon-wrapper">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
          <input type="text" id="s-name" placeholder="Enter your full name" required>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="s-email" style="color: var(--primary);">Email Address</label>
        <div class="input-icon-wrapper">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 0 0 2.22 0L21 8M5 19h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/></svg>
          <input type="email" id="s-email" placeholder="Enter your email address" required>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="s-password" style="color: var(--primary);">Password</label>
        <div class="input-icon-wrapper">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
          <input type="password" id="s-password" placeholder="Create a Password" required>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="s-confirm" style="color: var(--primary);">Confirm Password</label>
        <div class="input-icon-wrapper">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
          <input type="password" id="s-confirm" placeholder="Confirm your Password" required>
        </div>
      </div>

      <!-- Agreement -->
      <label class="form-checkbox">
        <input type="checkbox" required style="accent-color: var(--primary);">
        <span style="color: var(--primary); font-weight: 500;">I agree to the <a href="404.html" style="color: var(--accent); text-decoration: underline; font-weight: 700;">Terms of Service</a> and <a href="404.html" style="color: var(--accent); text-decoration: underline; font-weight: 700;">Privacy Policy</a></span>
      </label>

      <!-- Submit Button -->
      <button type="submit" class="btn-auth-submit" style="background-color: var(--primary);">Create Account</button>

      <div class="auth-divider">
        <span style="background-color: var(--light-sage); color: var(--primary);">or continue with</span>
      </div>

      <div class="auth-social-row">
        <button type="button" class="btn-auth-social" onclick="window.location.href='login.html';">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114A5.53 5.53 0 0 1 8.4 13a5.53 5.53 0 0 1 5.59-5.514c2.25 0 3.996.953 4.946 1.87l3.22-3.14C20.19 4.343 17.398 3 14 3a10 10 0 0 0-10 10 10 10 0 0 0 10 10c6.04 0 9.804-4.237 9.804-10a8.775 8.775 0 0 0-.164-1.715H12.24z"/></svg>
          Google
        </button>
        <button type="button" class="btn-auth-social" onclick="window.location.href='login.html';">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M9 8H7v3h2v9h3v-9h3l.5-3H12V6c0-.88.39-1 1-1h2V2h-3c-2.42 0-3 1.35-3 3v3z"/></svg>
          Facebook
        </button>
      </div>

      <p class="auth-footer-text" style="color: var(--primary);">Already have an account? <a href="login.html" style="color: var(--accent); font-weight: 800;">Log In</a></p>
    </form>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
